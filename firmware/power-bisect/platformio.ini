; Прошивки для бісекції струму сну. Не бойові й не стендові: кожне середовище
; тут — це один крок плану з `docs/дослідження/струм-сну.md`, тобто рівно один доданий
; блок ініціалізації проти попереднього кроку.
;
; Сенс у тому, щоб між замірами мінявся ОДИН чинник. Тому проєкт окремий:
; у greenhouse-node-lowpower навіть найтихіше середовище тягне за собою
; сенсори, телеметрію і RTC-лог, і «прибрати зайве прапорцем» там не вийде.
;
;   make deploy PROJECT=power-bisect PIO_ENV=step_a_sleep
;   make deploy PROJECT=power-bisect PIO_ENV=step_b_radio
;   make deploy PROJECT=power-bisect PIO_ENV=step_c_periph
;   make deploy PROJECT=power-bisect PIO_ENV=idle_awake

[platformio]
default_envs = step_a_sleep

[env]
; У src/ два незалежні набори: бісекція (main.cpp) і демонстраційний цикл
; (demo.cpp). Кожне середовище бере рівно один файл, інакше два setup() не
; злінкуються.
build_src_filter = +<main.cpp> -<demo.cpp>
platform = espressif32
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
monitor_port = ${sysenv.SERIAL_PORT}
upload_port = ${sysenv.SERIAL_PORT}
lib_deps =
    jgromes/RadioLib@^6.6.0
    thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays@^4.6.1

; Serial за замовчуванням мовчить у всіх середовищах: замір іде на батареї з
; вимкненим USB, друкувати нема кому, а увімкнений UART — це ще один
; периферійний блок, який довелось би виключати з підозрюваних.
; Разовий діагностичний прогін по USB:
;   PLATFORMIO_BUILD_FLAGS=-DAGRO_DEBUG_SERIAL make deploy PROJECT=power-bisect PIO_ENV=step_b_radio

; --- Крок A: підлога плати -------------------------------------------------
; setup() робить рівно одну дію — лягає спати. Нічого не ініціалізовано:
; ні SPI, ні I2C, ні Vext, ні радіо. Те, що прилад покаже тут, прошивкою не
; прибирається в принципі — це залізо (LED, CP2102, LDO, контролер заряду).
[env:step_a_sleep]
build_flags = -DAGRO_STEP=1 -DWAKE_MINUTES=10

; --- Крок B: A + радіо -----------------------------------------------------
; Додано SPI.begin() + radio.begin() + radio.sleep(). Різниця проти A — це
; ціна SX1262 у тому стані, в якому його лишає бойова прошивка.
[env:step_b_radio]
build_flags = -DAGRO_STEP=2 -DWAKE_MINUTES=10

; --- Крок C: B + периферія -------------------------------------------------
; Додано Vext (увімкнули й зняли), обидві шини I2C і ініціалізацію дисплея —
; усе, що бойова прошивка чіпає, крім самих сенсорів і телеметрії.
[env:step_c_periph]
build_flags = -DAGRO_STEP=3 -DWAKE_MINUTES=10

; --- Крок E: чужий рецепт цілком -------------------------------------------
; Не наступний крок бісекції, а порядок укладання спати з бібліотеки
; ropg/heltec_esp32_lora_v3, узятий як є: radio.begin() + radio.sleep(false),
; Vext знято, світлодіод погашено, і УСІ периферійні піни переведені в INPUT.
; Бібліотека заявляє 24 мкА на цій платі при пробудженні за таймером.
;
; Питання кроку: 0,84 мА — це наша прошивка чи наш екземпляр плати.
[env:step_e_ropg]
build_flags = -DAGRO_STEP=4 -DWAKE_MINUTES=10

; --- Демонстраційний цикл: видно очима ------------------------------------
; 3 секунди неспання з відліком на екрані, 10 секунд сну, і знову. На екрані
; номер циклу й режим, на приладі — як число ходить у такт із написами.
;
; Пара середовищ відрізняється рівно способом засинання, решта однакова:
;   demo_clean — повний розбір (рецепт ropg), очікуємо ~0,01 мА уві сні
;   demo_leaky — як бойова прошивка сьогодні, очікуємо ~0,84 мА
;
; Тривалості міняються без правки коду:
;   PLATFORMIO_BUILD_FLAGS='-DAWAKE_S=5 -DSLEEP_S=20' make deploy ...
[env:demo_clean]
build_src_filter = -<*> +<demo.cpp>
build_flags = -DDEMO_CLEAN

[env:demo_leaky]
build_src_filter = -<*> +<demo.cpp>

; --- Постійне живлення, без сну і без сенсорів -----------------------------
; Плата не спить взагалі й нічого не робить: порожній loop() з delay(). Це
; друга опорна точка — скільки їсть сам ESP32-S3 у неспанні, без радіо,
; екрана й сенсорів. Проти неї читається вікно семплювання (30-46 мА).
[env:idle_awake]
build_flags = -DAGRO_STEP=0

; Те саме неспання, але на 80 МГц — як у бойовій прошивці (setCpuFrequencyMhz).
; Пара до idle_awake: показує, скільки коштує сама частота.
[env:idle_awake_80]
build_flags = -DAGRO_STEP=0 -DCPU_MHZ=80

; Пара до idle_awake, де перший рядок setup() знімає Vext: екран гасне разом з
; усім, що живиться від `Ve`. Різниця двох чисел — ціна екрана й периферійної
; шини, заміряна, а не взята з даташита (SSD1306 обіцяє ~10 мА).
;
; Прапорець не прив'язаний до цього середовища: додається до будь-якого кроку
; разово, не редагуючи ini —
;   PLATFORMIO_BUILD_FLAGS=-DFORCE_VEXT_OFF make deploy PROJECT=power-bisect PIO_ENV=step_a_sleep
[env:idle_awake_dark]
build_flags = -DAGRO_STEP=0 -DFORCE_VEXT_OFF

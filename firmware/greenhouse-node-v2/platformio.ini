; greenhouse-node-v2 — коротке вікно неспання.
;
; Вікно тут не задається часом, як у v1 (SAMPLE_WINDOW_MS), а виходить
; НАСЛІДКОМ: скільки відліків, з якою паузою, після якого прогріву. Так і має
; бути — час неспання це те, що ми платимо, а не те, що замовляємо.
;
; Курс обміну заміряний: 39,55 мА неспання проти 0,01 мА сну, тобто одна
; секунда вікна коштує як 4000 секунд сну. Через це кожен параметр нижче — це
; прямо години ресурсу батареї, а не абстракція.

[platformio]
default_envs = v2_15min

[env]
platform = espressif32
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
monitor_port = ${sysenv.SERIAL_PORT}
upload_port = ${sysenv.SERIAL_PORT}
lib_deps =
    jgromes/RadioLib@^6.6.0
    adafruit/Adafruit SHT31 Library@^2.2.2

; Модулі лежать по теках (core / sensors / telemetry), тому include-и пишуться
; від кореня src: #include "core/board.h". Без цього прапорця вони резолвились
; би відносно файлу, і кожен переїзд теки ламав би половину заголовків.
;
; У кожному середовищі нижче стоїть ${env.build_flags} — саме так PlatformIO
; ДОДАЄ прапорці до спільних. Без цієї вставки локальний build_flags просто
; перекрив би -I src, і збірка впала б на першому ж include.
build_flags = -I src

; ---------------------------------------------------------------------------
; Бойові
; ---------------------------------------------------------------------------
; SOIL_WARMUP_MS=3000 — обережний дефолт, і це свідомий вибір, а не запас
; навмання. Єдина точка, про яку ТОЧНО відомо, що сенсор на ній усталений —
; 3,2 с: це позиція 1 старого бурста, де зсуву вже нема. Усе, що менше, поки
; надія, бо між 0,087 с і 3,2 с у зібраних даних нема жодного відліку.
;
; Очікуване вікно: ~3,9 с проти 21,7 с у v1, тобто ×5,5.
; Після зняття кривої виходу сенсора тут стане заміряне число, і вікно впаде
; до ~1 с — ще ×4 зверху.

[env:v2_15min]
build_flags = ${env.build_flags} -DSLEEP_MINUTES=15 -DSOIL_SAMPLES=3 -DSOIL_GAP_MS=50 -DSOIL_WARMUP_MS=3000

; Той самий вузол, цикл 5 хв — для порівняння проти v1, яка зараз стоїть на 5.
[env:v2_5min]
build_flags = ${env.build_flags} -DSLEEP_MINUTES=5 -DSOIL_SAMPLES=3 -DSOIL_GAP_MS=50 -DSOIL_WARMUP_MS=3000

; ---------------------------------------------------------------------------
; Експериментальні
; ---------------------------------------------------------------------------
; Прогрів нуль: вікно падає до ~0,9 с, тобто ×24 проти v1. Ставити ТІЛЬКИ разом
; із перевіркою — порівняти soil_raw з v2_15min на тому самому ґрунті. Якщо
; різниці нема, прогрів не потрібен взагалі і це можна забрати в бойову.
;
; Ризик відомий і названий: перший відлік циклу занижений на 22 одиниці
; (стабільно, 442 бурсти з 442), і невідомо, чи встигає сенсор усталитись до
; 90-й мілісекунди. SOIL_DISCARD_FIRST=1 прибирає найгіршу точку, але не
; гарантує, що друга вже чиста.
[env:v2_fast]
build_flags = ${env.build_flags} -DSLEEP_MINUTES=15 -DSOIL_SAMPLES=3 -DSOIL_GAP_MS=50 -DSOIL_WARMUP_MS=0

; П'ять відліків замість трьох. Медіана з п'яти стійкіша до двох викидів
; замість одного, коштує +100 мс вікна. Чи варте — вирішує розкид soil_min /
; soil_max на живих даних, а не міркування.
[env:v2_wide]
build_flags = ${env.build_flags} -DSLEEP_MINUTES=15 -DSOIL_SAMPLES=5 -DSOIL_GAP_MS=50 -DSOIL_WARMUP_MS=3000

; Цикл 1 хвилина, але Serial МОВЧИТЬ — і це принципово.
;
; Для заміру струму сну плата має стояти в тій самій конфігурації, що й у
; полі: на батареї, з від'єднаним USB. Увімкнений UART і живий USB-UART міст
; (CP2102) — це окремий споживач порядку 0,1-1 мА, тобто в сто разів більший за
; те, що ми міряємо. З ним замір показує стенд, а не вузол.
;
; Хвилинний цикл лишається, щоб спалахи йшли часто й не доводилось чекати
; чверть години між ними. Ресурс батареї в цьому режимі не рахувати — при
; циклі 60 с вікно займає 7,6% часу замість 0,5%.
[env:v2_quiet_1min]
build_flags = ${env.build_flags} -DSLEEP_MINUTES=1 -DSOIL_SAMPLES=3 -DSOIL_GAP_MS=50 -DSOIL_WARMUP_MS=3000 -DNODE_ID=3

; ---------------------------------------------------------------------------
; Стендове
; ---------------------------------------------------------------------------
; Цикл 1 хвилина й друк у Serial. Потрібне тому, що бойова прошивка на столі
; виглядає несправною: Serial мовчить за задумом, екрана в цій прошивці нема
; взагалі, і плата, яка справно шле, здається вимкненою.
;
; Ресурс батареї в цьому режимі не рахувати.
[env:v2_bench]
build_flags = ${env.build_flags} -DSLEEP_MINUTES=1 -DSOIL_SAMPLES=3 -DSOIL_GAP_MS=50 -DSOIL_WARMUP_MS=3000 -DAGRO_DEBUG_SERIAL -DNODE_ID=3

; ---------------------------------------------------------------------------
; Діагностика датчика повітря
; ---------------------------------------------------------------------------
; Друкує криву "ms,T,RH" від подачі Vext протягом 30 секунд, штатний цикл не
; виконується. Відповідає на питання, чи можна перенести SHT31 з постійних 3V3
; на комутований `Ve`.
;
; Ставка: модуль їсть ~1 мА цілодобово (заміряно 31.08.2026) — це 80% усього
; бюджету вузла. Але power-budget.md стверджує, що імпульсне живлення псує
; вологість. Твердження ніколи не перевірялось.
;
; ПРОГІН ПАРНИЙ, порядок має значення:
;   1. зняти криву ЗАРАЗ, поки VCC на 3V3 — сенсор не вимикався, це база
;   2. перекинути ОДИН дріт: VCC з 3V3 (J3 pin 2) на Ve (J2 pin 3/4)
;   3. зняти ту саму криву ще раз
; Різниця між кривими і є ефект вимикання живлення; решта незмінна.
[env:v2_airprobe]
build_flags = ${env.build_flags} -DSLEEP_MINUTES=1 -DAIR_PROBE_MS=30000 -DAGRO_DEBUG_SERIAL -DNODE_ID=3

; Крива виходу ҐРУНТОВОГО сенсора — найдорожча незнята міра в проєкті.
;
; Заповнює порожнечу між 87 мс (де відлік занижений на 21,66) і 3,2 с (де вже
; чистий). У зібраних даних там нема жодної точки, бо в v1 такт між відліками
; задавала передача по LoRa.
;
; 10 секунд із кроком 25 мс = 400 точок. Радіо в цьому режимі не піднімається:
; воно коштувало б ~450 мс на старті, а саме ці мілісекунди й досліджуються.
[env:v2_soilprobe]
build_flags = ${env.build_flags} -DSLEEP_MINUTES=1 -DSOIL_PROBE_MS=10000 -DAGRO_DEBUG_SERIAL -DNODE_ID=3

; ---------------------------------------------------------------------------
; Етап 4: v2 у теплиці поруч із v1
; ---------------------------------------------------------------------------
; NODE_ID=3 -> stage4-lowpower-v2 у server/config/nodes.yaml.
;
; Інтервал 5 хв НЕ тому, що він правильний (штатний — 15), а тому що v1 зараз
; стоїть на 5. Спершу обидва вузли мають кілька діб попрацювати на ОДНАКОВОМУ
; інтервалі: це дає базову розбіжність між екземплярами щупів, позиціями в
; ґрунті й банками. Без неї подальша різниця інтервалів приїде змішаною з
; різницею залоза, і розчепити буде нічим.
;
; Розводити на 5 і 15 — лише після того, як база знята.
[env:stage4_5min]
build_flags = ${env.build_flags} -DSLEEP_MINUTES=5 -DSOIL_SAMPLES=3 -DSOIL_GAP_MS=50 -DSOIL_WARMUP_MS=3000 -DNODE_ID=3

; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Стендова прошивка: живе на столі з USB, друк у Serial — половина її сенсу,
; тому AGRO_DEBUG_SERIAL увімкнено. Прибрати цей рядок = зібрати мовчазну
; версію (у greenhouse-node-lowpower друку нема за замовчуванням).
[env:heltec_wifi_lora_32_V3]
build_flags = -DAGRO_DEBUG_SERIAL
platform = espressif32
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
monitor_port = ${sysenv.SERIAL_PORT}
upload_port = ${sysenv.SERIAL_PORT}
lib_deps =
    jgromes/RadioLib@^6.6.0
    thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays@^4.6.1
    adafruit/Adafruit SHT31 Library@^2.2.2

; Калібрувальний стенд ґрунтових сенсорів: плата лежить на столі з USB і
; друкує CSV у Serial. Ні LoRa, ні сну, ні відсотків — тільки сирі числа,
; бо саме з них потім рахуються межі для soilRawToPercent().
;
;   make deploy PROJECT=soil-calibration
;   make soil-log RUN=v12-vs-v20
;
; RadioLib у lib_deps свідомо нема: радіо тут не використовується, а без нього
; збірка помітно швидша.

; Наша тека data/ тримає CSV прогонів — 2,6 МБ і росте. Для PlatformIO ж
; `data/` це СЛУЖБОВА назва: з неї збирається образ файлової системи для
; флеша. Поки ніхто не запускав `uploadfs`, це нікого не кусало, але з появою
; LittleFS (черга пачок у флеші, портал) хтось її виконає — і вона спробує
; запхати мегабайти вимірів у розділ на ~1,5 МБ.
;
; Переносимо джерело образу в окрему теку. Наші дані лишаються в data/ як були.
[platformio]
; Без цього `pio run` без -e збирає ВСІ середовища, зокрема wifi_*, яким
; потрібні облікові дані. Звичайна збірка має працювати без .env.
default_envs = heltec_wifi_lora_32_V3
data_dir = fsdata

[env:heltec_wifi_lora_32_V3]
platform = espressif32
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
monitor_port = ${sysenv.SERIAL_PORT}
upload_port = ${sysenv.SERIAL_PORT}
lib_deps =
    thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays@^4.6.1
    adafruit/Adafruit SHT31 Library@^2.2.2

; ---------------------------------------------------------------------------
; Польовий режим: телеметрія в хмару по Wi-Fi
; ---------------------------------------------------------------------------
; USB-вивід НЕ вимикається — він лишається опорним трактом, з яким звіряють
; хмару (фаза 4 плану). Ця збірка лише додає другий канал.
;
; Облікові дані й токен передаються ззовні, у репозиторії їм не місце:
;
;   PLATFORMIO_BUILD_FLAGS='-DWIFI_SSID=\"MyPhone\" -DWIFI_PASS=\"secret\" \
;     -DINGEST_URL=\"https://app.vercel.app/api/ingest\" -DINGEST_TOKEN=\"abc123\"' \
;     make deploy PROJECT=soil-calibration PIO_ENV=wifi_field
;
; Радіо за замовчуванням вимкнене під час заміру й вмикається лише на
; відправку пачки — див. коментар до блоку AGRO_WIFI у main.cpp.
[env:wifi_field]
extends = env:heltec_wifi_lora_32_V3
build_flags = -DAGRO_WIFI

; Те саме, але радіо тримається піднятим постійно. Існує заради фази 0:
; порівняти σ у двох режимах і дізнатись, чи потрібен BURST на наших платах.
; Для збору даних не використовувати, доки фаза 0 не показала, що шум не росте.
[env:wifi_field_always]
extends = env:heltec_wifi_lora_32_V3
build_flags = -DAGRO_WIFI -DAGRO_WIFI_ALWAYS

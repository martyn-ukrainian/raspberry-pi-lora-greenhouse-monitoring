; Калібрувальний стенд ґрунтових сенсорів: плата лежить на столі з USB і
; друкує CSV у Serial. Ні LoRa, ні сну, ні відсотків — тільки сирі числа,
; бо саме з них потім рахуються межі для soilRawToPercent().
;
;   make deploy PROJECT=soil-calibration
;   make soil-log RUN=v12-vs-v20
;
; RadioLib у lib_deps свідомо нема: радіо тут не використовується, а без нього
; збірка помітно швидша.

[env:heltec_wifi_lora_32_V3]
platform = espressif32
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
monitor_port = ${sysenv.SERIAL_PORT}
upload_port = ${sysenv.SERIAL_PORT}
lib_deps =
    thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays@^4.6.1
    adafruit/Adafruit SHT31 Library@^2.2.2

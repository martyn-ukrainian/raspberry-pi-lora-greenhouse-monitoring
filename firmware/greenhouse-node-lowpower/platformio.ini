; Енергозберігаюча прошивка вузла: замір -> LoRa -> deep sleep.
; Інтервал сну обирається середовищем збірки, не редагуванням коду:
;   make build  PROJECT=greenhouse-node-lowpower PIO_ENV=lowpower_5min
;   make deploy-lowpower SLEEP=15
; Різниця між середовищами — рівно один -D, решта спільна в [env].

[platformio]
default_envs = lowpower_15min

; Serial у бойових середовищах нема взагалі: у теплиці USB не підключений, а
; кожен printf — це і місце у flash, і час на UART, і блокуючий flush перед
; сном. Прапорець -DAGRO_DEBUG_SERIAL вмикає весь друк назад; додати його разово,
; не редагуючи ini:
;   PLATFORMIO_BUILD_FLAGS=-DAGRO_DEBUG_SERIAL make build PROJECT=... PIO_ENV=...

[env]
platform = espressif32
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
monitor_port = ${sysenv.SERIAL_PORT}
upload_port = ${sysenv.SERIAL_PORT}
lib_deps =
    jgromes/RadioLib@^6.6.0
    thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays@^4.6.1
    adafruit/Adafruit SHT31 Library@^2.2.2

[env:lowpower_15min]
build_flags = -DSLEEP_MINUTES=15

[env:lowpower_5min]
build_flags = -DSLEEP_MINUTES=5

; Діагностичне середовище: друкує в Serial криву "мілісекунди,s1,s2,s3" від
; моменту подачі живлення протягом заданої кількості секунд — щоб побачити, за
; скільки ємнісні сенсори реально виходять на полицю, і підібрати
; SOIL_WARMUP_MS. 60 с навмисне: саме ця крива вирішує, чи є сенс тримати
; живлення хвилину. Не для теплиці.
[env:lowpower_probe]
build_flags = -DSLEEP_MINUTES=15 -DSOIL_WARMUP_PROBE=60 -DAGRO_DEBUG_SERIAL

; A/B-порівняння двох стратегій прогріву в одному циклі: штатний швидкий замір
; (SOIL_WARMUP_MS) і повторний на 60-й секунді, обидва їдуть у телеметрії як
; soil_fast / soil_slow. Дає відповідь на "чи варто працювати хвилину" на
; парних даних, а не на порівнянні різних вузлів. Ресурс ~1 міс — режим на
; кілька днів, не назавжди.
[env:lowpower_abtest]
build_flags = -DSLEEP_MINUTES=15 -DSOIL_AB_TEST=60

; ---------------------------------------------------------------------------
; Етап 3a: валідація сну
; ---------------------------------------------------------------------------
; Питання етапу: чи збігаються показники після пробудження з тими, що дає
; вузол, який працює безперервно. Порівнюється не на око, а проти опорного
; вузла (greenhouse-node) — обидва стоять поруч, у тому самому ґрунті.
;
; Вікно пробудження тут — це SOIL_WARMUP_MS, тобто скільки Vext подано до
; заміру. Заміряно 2026-08-22: v2.0 виходить на полицю за 0,1 с (`T±10`), і
; пауза без живлення на це не впливає (перевірено 3 с проти 120 с). Але
; deep sleep — це ще й холодний старт УСІЄЇ плати: заново калібрується ADC,
; піднімається радіо. Оце й перевіряється.
;
;   make deploy PROJECT=greenhouse-node-lowpower PIO_ENV=sleep_win10
;   make deploy PROJECT=greenhouse-node-lowpower PIO_ENV=sleep_win30
[env:sleep_win10]
build_flags = -DSLEEP_MINUTES=15 -DSOIL_WARMUP_MS=10000

[env:sleep_win30]
build_flags = -DSLEEP_MINUTES=15 -DSOIL_WARMUP_MS=30000

; Те саме, але парно в одному циклі: штатний замір на SOIL_WARMUP_MS і
; повторний на 30-й секунді, обидва їдуть як soil_fast / soil_slow. Сильніше
; за два вузли з різними вікнами — там різниця вікон змішалась би з різницею
; екземплярів і місця в ґрунті.
[env:sleep_win_ab]
build_flags = -DSLEEP_MINUTES=15 -DSOIL_WARMUP_MS=10000 -DSOIL_AB_TEST=30

; Стендове середовище: те саме, що lowpower_5min, але видно й чути роботу.
;
; Потрібне тому, що бойова прошивка на столі виглядає несправною: Serial
; мовчить за задумом, а екран вмикається ЛИШЕ після ручного RESET — на
; пробудженні за таймером він не засвічується взагалі. Плата, яка справно
; шле, при цьому здається вимкненою.
;
; Тут екран показує хід циклу (прокинувся -> гріє ґрунт -> SENT/TX FAIL ->
; засинає) і додається друк у Serial. Обидва коштують енергії, тому в теплицю
; йде lowpower_5min / lowpower_15min, а не це.
;
;   make upload PROJECT=greenhouse-node-lowpower PIO_ENV=lowpower_bench \
;     SERIAL_PORT=/dev/cu.usbserial-0001 PLATFORMIO_BUILD_FLAGS='-DNODE_ID=2'
[env:lowpower_bench]
build_flags = -DSLEEP_MINUTES=5 -DAGRO_DEBUG_SERIAL -DAGRO_SCREEN_TRACE

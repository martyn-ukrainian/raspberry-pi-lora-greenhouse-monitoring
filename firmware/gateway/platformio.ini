; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:heltec_wifi_lora_32_V3]
platform = espressif32
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
monitor_port = ${sysenv.SERIAL_PORT}
upload_port = ${sysenv.SERIAL_PORT}
lib_deps =
    jgromes/RadioLib@^6.6.0
    thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays@^4.6.1

; Шлюз з дублюванням потоку в мережу. Потрібен, бо шнур до Pi виявився
; зарядним — без ліній даних USB-тракт непрацездатний фізично.
;
; Облікові дані Wi-Fi і адреса приймача приходять з firmware/.env через
; Makefile (він підставляє їх для будь-якого середовища з префіксом wifi_):
;
;   make upload PROJECT=gateway PIO_ENV=wifi_pi SERIAL_PORT=/dev/cu.usbserial-0001
;
; Serial при цьому лишається робочим — той самий потік видно і по USB, коли
; плату приносять до комп'ютера з нормальним шнуром.
[env:wifi_pi]
extends = env:heltec_wifi_lora_32_V3
build_flags = -DAGRO_WIFI

<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Ґрунт · калібрування</title>
<link rel="stylesheet" href="https://unpkg.com/uplot@1.6.31/dist/uPlot.min.css">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&display=swap">
<style>
  /* Палітра «теплиця»: теплий темний фон із зеленуватим відтінком, акцент —
     мох. Усі пари текст/фон ≥ 4.5:1 у двох темах — сторінку читають на сонці. */
  :root {
    --bg:#f3f2ec; --card:#fbfbf8; --card2:#f4f4ee; --fg:#1b1f18; --mut:#5f645a; --line:#dcdbd0; --line2:#ebeae2;
    --acc:#4b7a2c; --acc-fg:#ffffff; --acc-soft:#e6f0da; --acc-txt:#3f6b24;
    --ok:#2c6a36;   --ok-bg:#e1efda;
    --warn:#85560e; --warn-bg:#f7ecd3;
    --bad:#a33a2d;  --bad-bg:#f9e3de;
    --info:#3b5568; --info-bg:#e4ecf1;
    --c1:#2d7fc4; --c2:#d0603e; --c3:#17978a; --c4:#7d57c4;   /* канали на графіку */
    --shadow:0 1px 2px rgba(30,35,20,.06), 0 0 0 1px var(--line);
    --hl:inset 0 1px 0 rgba(255,255,255,.8);
    --bar-h: 150px; /* висота нижньої панелі; JS уточнює */
  }
  @media (prefers-color-scheme: dark) { :root {
    --bg:#141613; --card:#1e211d; --card2:#181b17; --fg:#eef0e8; --mut:#a4a99c; --line:#2d312a; --line2:#252922;
    --acc:#8cbf66; --acc-fg:#141613; --acc-soft:#27381f; --acc-txt:#b9dc9a;
    --ok:#a4d89b;   --ok-bg:#223520;
    --warn:#ecc56f; --warn-bg:#3a3014;
    --bad:#f3a597;  --bad-bg:#45211c;
    --info:#b6cbd9; --info-bg:#22303a;
    --c1:#5fa8e6; --c2:#ee8a6c; --c3:#3cbfae; --c4:#b08ae6;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 0 0 1px var(--line);
    --hl:inset 0 1px 0 rgba(255,255,255,.05);
  } }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin:0; background:var(--bg); color:var(--fg);
    font:15px/1.4 "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; overflow-x:hidden; }
  main { max-width: 760px; margin: 0 auto; padding: 8px 12px calc(var(--bar-h) + env(safe-area-inset-bottom) + 32px); }
  a { color:var(--acc-txt); }
  select, input, button { font:inherit; color:var(--fg); background:var(--card); border:1px solid var(--line); border-radius:12px; min-height:44px; padding:8px 12px; }
  button { cursor:pointer; -webkit-tap-highlight-color: transparent; }
  button:disabled { opacity:.55; cursor:default; }
  button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible { outline:3px solid var(--acc); outline-offset:2px; }
  .num { font-variant-numeric: tabular-nums; }
  .card { background:linear-gradient(180deg, var(--card), var(--card2)); border:0; box-shadow:var(--shadow), var(--hl); border-radius:14px; }

  header { display:flex; gap:6px 10px; align-items:center; flex-wrap:wrap; margin-bottom:8px; }
  header h1 { font-size:17px; font-weight:600; letter-spacing:-.2px; margin:0; flex:1 1 auto; }
  header h1 span { color:var(--mut); font-weight:400; }
  header select { flex:0 1 auto; max-width:100%; padding:6px 8px; border-radius:10px; }

  /* Стан зв’язку з платою: рядок стану + тонка смужка до наступної пачки. */
  .status { padding:9px 12px 8px; margin-bottom:8px; }
  .status .st-line { display:flex; align-items:center; gap:8px; font-weight:600; font-size:15px; }
  .status .dot { width:10px; height:10px; border-radius:50%; background:var(--mut); flex:none; box-shadow:0 0 0 3px color-mix(in srgb, currentColor 12%, transparent); }
  .status .st-age { margin-left:auto; font-weight:400; color:var(--mut); white-space:nowrap; font-size:14px; }
  .status .bar { height:4px; border-radius:2px; background:var(--line2); margin:7px 0 5px; overflow:hidden; }
  .status .bar i { display:block; height:100%; width:0; background:var(--mut); border-radius:2px; transition: width .9s linear; }
  .status .st-foot { display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; }
  .status .st-next { font-size:13px; color:var(--mut); }
  /* Батарея — тут же, бо це теж «умови прогону»: чи доживе плата до кінця.
     Ховається цілком, коли плата на USB і полів vbat/bat_pct нема. */
  .bat { display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:600; color:var(--fg); margin-left:auto; }
  .bat[hidden] { display:none; }
  .bat-glyph { position:relative; display:inline-block; width:22px; height:11px; border:1.5px solid currentColor; border-radius:3px; padding:1.5px; box-sizing:border-box; }
  .bat-glyph::after { content:''; position:absolute; right:-4px; top:2.5px; width:2.5px; height:4px; background:currentColor; border-radius:0 1px 1px 0; }
  .bat-glyph b { display:block; height:100%; width:0; background:currentColor; border-radius:1px; }
  .bat.warn { color:var(--warn); } .bat.bad { color:var(--bad); }
  .bat-alert { margin-top:7px; padding:5px 9px; border-radius:8px; font-size:13px; font-weight:600; }
  .bat-alert[hidden] { display:none; }
  .bat-alert.warn { background:var(--warn-bg); color:var(--warn); } .bat-alert.bad { background:var(--bad-bg); color:var(--bad); }
  .status.warn .bat-alert, .status.bad .bat-alert { background:rgba(0,0,0,.1); color:inherit; }
  .status.warn .bat, .status.bad .bat { color:inherit; }
  /* Підказка до ліній графіка, в яких нема плитки: °C, V батареї, мітки доливів. */
  .hint { display:flex; flex-wrap:wrap; gap:2px 12px; font-size:12px; color:var(--mut); padding:0 2px 6px; }
  .hint:empty { display:none; }
  .sw { display:inline-block; width:16px; height:0; border-top:2px dashed var(--warn); vertical-align:middle; margin-right:5px; }
  .sw-v { border-top-color:var(--mut); } .sw-p { border-top-color:var(--acc); border-top-width:2px; }
  .status.ok .dot, .status.ok .bar i { background:var(--ok); } .status.ok .dot { color:var(--ok); }
  .status.wait .dot, .status.wait .bar i { background:var(--mut); }
  .status.warn { background:var(--warn-bg); color:var(--warn); box-shadow:none; }
  .status.warn .dot, .status.warn .bar i { background:var(--warn); } .status.warn .bar { background:rgba(0,0,0,.12); }
  .status.bad  { background:var(--bad-bg); color:var(--bad); box-shadow:none; }
  .status.bad .dot, .status.bad .bar i { background:var(--bad); } .status.bad .bar { background:rgba(0,0,0,.12); }
  .status.warn .st-age, .status.warn .st-next, .status.bad .st-age, .status.bad .st-next { color:inherit; opacity:.9; }
  @keyframes blink { 50% { opacity:.25; } }
  .status.bad .dot { animation: blink 1.2s step-start infinite; }

  .banner { padding:10px 12px; border-radius:12px; background:var(--bad-bg); color:var(--bad); margin-bottom:8px; display:none; font-weight:600; }

  /* Плитки каналів: велике число мВ, під ним σ/хв кольоровим бейджем. */
  .tiles { display:grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap:8px; margin-bottom:6px; }
  @media (min-width: 640px) { .tiles { grid-template-columns: repeat(4, minmax(0,1fr)); } }
  .tile { padding:8px 11px 10px; min-width:0; }
  .tile { cursor:pointer; }
  .tile.off { opacity:.45; }
  .tile .lbl { display:flex; align-items:center; gap:6px; color:var(--mut); font-size:13px; font-weight:600; letter-spacing:.2px; }
  .tile .lbl i { width:9px; height:9px; border-radius:3px; flex:none; display:inline-block; }
  .tile .val { font-size:34px; font-weight:600; line-height:1.15; letter-spacing:-1px; margin-top:1px; }
  .tile .val small { font-size:13px; color:var(--mut); font-weight:400; letter-spacing:0; margin-left:1px; }
  .tile .raw { color:var(--mut); font-size:12.5px; }
  .tile .sig { display:inline-block; margin-top:6px; font-size:12.5px; font-weight:600; padding:2px 8px; border-radius:999px; background:var(--line2); color:var(--mut); }
  .sig.ok { color:var(--ok); background:var(--ok-bg); } .sig.warn { color:var(--warn); background:var(--warn-bg); } .sig.bad { color:var(--bad); background:var(--bad-bg); }
  .env { display:flex; flex-wrap:wrap; gap:2px 12px; color:var(--mut); font-size:13px; padding:2px 2px 4px; }
  .env b { color:var(--fg); font-weight:600; }

  #chart { margin:2px 0 0; width:100%; overflow:hidden; }
  .events { font-size:13px; color:var(--mut); border-top:1px solid var(--line); }
  .events summary { cursor:pointer; min-height:44px; display:flex; align-items:center; font-weight:600; color:var(--fg); list-style:none; }
  .events summary::-webkit-details-marker { display:none; }
  .events summary::before { content:'▸'; margin-right:6px; color:var(--mut); font-size:12px; }
  .events[open] summary::before { content:'▾'; }
  .events div { padding:3px 0; }

  footer { margin-top:6px; display:flex; gap:4px 6px; flex-wrap:wrap; align-items:center; font-size:14px; color:var(--mut); }
  footer a, footer button { display:inline-flex; align-items:center; min-height:44px; padding:0 10px; border:0; background:none; color:var(--acc-txt); text-decoration:underline; text-underline-offset:3px; border-radius:8px; }

  /* Нижня панель дій: завжди під великим пальцем. */
  .actionbar { position:fixed; left:0; right:0; bottom:0; z-index:5;
    background:var(--card); border-top:1px solid var(--line); box-shadow:0 -8px 24px rgba(0,0,0,.12);
    padding:8px 12px calc(8px + env(safe-area-inset-bottom)); }
  .actionbar .inner { max-width:760px; margin:0 auto; }
  .pending { display:none; align-items:center; gap:8px; border-radius:10px; padding:6px 10px; margin-bottom:8px; font-size:13.5px; font-weight:600;
    background:var(--info-bg); color:var(--info); }
  .pending.show { display:flex; }
  .pending .spin { width:14px; height:14px; border:2px solid currentColor; border-right-color:transparent; border-radius:50%; flex:none; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .pending.done { background:var(--ok-bg); color:var(--ok); } .pending.done .spin { display:none; }
  .pending.err { background:var(--bad-bg); color:var(--bad); } .pending.err .spin { display:none; }
  .pending .txt { flex:1; min-width:0; }
  .amount { display:flex; gap:6px; margin-bottom:8px; }
  .amount button { flex:1; min-width:0; padding:8px 4px; font-weight:600; font-size:17px; background:var(--bg); }
  .amount button.on { background:var(--acc-soft); border-color:var(--acc); color:var(--acc-txt); box-shadow:inset 0 0 0 1px var(--acc); }
  .amount .field { flex:1.3; display:flex; align-items:center; gap:4px; }
  .amount .field input { flex:1; min-width:0; width:100%; text-align:right; padding:8px 8px; font-size:17px; }
  .amount .field span { color:var(--mut); font-size:13px; }
  button.pour { display:block; width:100%; min-height:58px; font-size:20px; font-weight:700; border-radius:16px; letter-spacing:-.2px;
    background:linear-gradient(180deg, color-mix(in srgb, var(--acc) 92%, #fff), var(--acc)); color:var(--acc-fg); border-color:transparent;
    box-shadow:0 2px 0 color-mix(in srgb, var(--acc) 60%, #000), var(--hl); }
  button.pour:active:not(:disabled) { transform: translateY(1px); box-shadow:none; }
  button.pour:disabled { opacity:.7; }
  .pour-msg { font-size:13.5px; color:var(--mut); text-align:center; padding-top:4px; display:none; }
  .pour-msg.show { display:block; }
  .pour-msg.bad { color:var(--bad); font-weight:600; }
  .pour-msg.ok { color:var(--ok); font-weight:600; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Ґрунт <span>· калібрування</span></h1>
    <select id="device" aria-label="плата"></select>
  </header>

  <section id="status" class="card status wait" aria-live="polite">
    <div class="st-line"><span class="dot" aria-hidden="true"></span><span id="stText">з’єднуюсь…</span><span id="stAge" class="st-age num"></span></div>
    <div class="bar"><i id="stBar"></i></div>
    <div class="st-foot">
      <span id="stNext" class="st-next num"></span>
      <span id="bat" class="bat num" hidden><i class="bat-glyph" aria-hidden="true"><b id="batFill"></b></i><span id="batTxt"></span></span>
    </div>
    <div id="batAlert" class="bat-alert" hidden></div>
  </section>

  <div id="banner" class="banner" role="alert"></div>

  <section class="tiles" id="tiles"></section>
  <div class="env num" id="env"></div>

  <div id="chart"></div>
  <div class="hint" id="chartHint" aria-hidden="true"></div>
  <details class="events" id="eventsBox" open>
    <summary id="eventsTitle">події</summary>
    <div id="events"></div>
  </details>

  <footer>
    <a id="csv" href="#">Вивантажити CSV</a>
    <a id="docs" href="/api/docs">API</a>
    <button id="token-reset" type="button"><span id="token-state">токен</span></button>
  </footer>
</main>

<div class="actionbar" id="actionbar">
  <div class="inner">
    <div id="pending" class="pending" aria-live="polite"><span class="spin" aria-hidden="true"></span><span class="txt" id="pendingTxt"></span></div>
    <div class="amount" id="amount">
      <button type="button" data-ml="20">20</button>
      <button type="button" data-ml="50">50</button>
      <button type="button" data-ml="100">100</button>
      <label class="field"><input id="ml" type="number" inputmode="decimal" min="1" max="5000" step="1" value="50" aria-label="мілілітри"><span>мл</span></label>
    </div>
    <button id="pour" class="pour" type="button">Влив 50 мл</button>
    <div id="pourMsg" class="pour-msg" aria-live="polite"></div>
  </div>
</div>

<script src="https://unpkg.com/uplot@1.6.31/dist/uPlot.iife.min.js"></script>
<script>
// Одна сторінка без збірки: опитує /api/live раз на 10 с і малює.
// Головний екран — телефон у теплиці, одна рука, сонце: великі числа,
// кнопка «влив» завжди внизу під пальцем, стан плати видно з першого погляду.
const POLL_MS = 10000;
const BATCH_S = 30;   // плата шле пачку кожні ~30 с
const STALE_S = 90;   // стільки ж, скільки STALE_AFTER_S у main.py
const LATE_S = 45;    // після цього показуємо «запізнюється» жовтим
// Пороги σ за хвилину, мВ. 0,6 — наш стенд; 3 — уже підозріло; 10 — мертвий
// або висячий канал (docs/калібрування-ґрунту.md).
const SIGMA_WARN = 3, SIGMA_BAD = 10;
// Батарея, %: нижче 20 — попередити, нижче 10 — прогін ось-ось зупиниться.
const BAT_WARN = 20, BAT_BAD = 10;
// Кольори каналів — з CSS-змінних теми (--c1…--c4), щоб плитки й графік збігались.
const cssVar = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const COLORS = ['--c1', '--c2', '--c3', '--c4'].map(cssVar);

const $ = (id) => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
let plot = null, device = null, lastData = null;
let skewMs = 0;            // годинник сервера − годинник телефона (із заголовка Date)
let knownPending = new Set(); // id доливів, що чекали підтвердження при минулому опитуванні
let pendingTimer = null;

const now = () => Date.now() + skewMs;

// ---------------------------------------------------------------- токен
function token() { return store.get('soil_token') || ''; }
function askToken() {
  const t = prompt('Токен приймача (той самий, що в прошивці):', token());
  if (t !== null) store.set('soil_token', t.trim());
  showTokenState();
}
function showTokenState() { $('token-state').textContent = token() ? 'токен: є' : 'токен: не задано'; }
$('token-reset').onclick = askToken;

// ---------------------------------------------------------------- плати
async function loadDevices() {
  const r = await fetch('/api/devices'); const list = await r.json();
  const sel = $('device'); sel.innerHTML = '';
  for (const d of list) {
    const o = document.createElement('option');
    o.value = d.id; o.textContent = (d.label || d.id) + (d.stale ? ' ⚠' : '');
    sel.appendChild(o);
  }
  if (!list.length) { showBanner('Жодна плата ще не надсилала даних.'); setStatus('bad', 'даних нема', '', 0, ''); return; }
  // ?device=… у посиланні має пріоритет над збереженим вибором (закладка на плату).
  const saved = new URLSearchParams(location.search).get('device') || store.get('soil_device');
  device = list.some(d => d.id === saved) ? saved : list[0].id;
  sel.value = device;
}
$('device').onchange = () => { device = $('device').value; store.set('soil_device', device); plot && plot.destroy(); plot = null; refresh(); };

function showBanner(text) { const b = $('banner'); b.textContent = text; b.style.display = text ? 'block' : 'none'; }

// ---------------------------------------------------------------- час
function fmtDur(s) { return s < 90 ? `${Math.round(s)} с` : s < 5400 ? `${Math.round(s / 60)} хв` : `${(s / 3600).toFixed(1)} год`; }
function fmtAgo(s) { return fmtDur(s) + ' тому'; }
// Батарея з останнього заміру; null, коли плата на USB (полів нема).
function batInfo(d) {
  const last = d && d.samples[d.samples.length - 1];
  if (!last || (last.bat_pct == null && last.vbat == null)) return null;
  const pct = last.bat_pct, v = last.vbat;
  const cls = pct == null ? '' : pct < BAT_BAD ? 'bad' : pct < BAT_WARN ? 'warn' : '';
  const txt = [pct == null ? null : `${pct} %`, v == null ? null : `${v.toFixed(2)} V`].filter(Boolean).join(' · ');
  return { pct, v, cls, txt };
}
function renderBattery(b, silent) {
  const el = $('bat'), al = $('batAlert');
  el.hidden = !b; if (!b) { al.hidden = true; return; }
  el.className = 'bat num ' + b.cls; $('batTxt').textContent = b.txt;
  $('batFill').style.width = (b.pct == null ? 0 : Math.max(0, Math.min(100, b.pct))) + '%';
  // Коли плата мовчить, про батарею каже сам червоний рядок — другого банера не треба.
  al.hidden = !b.cls || silent;
  if (!al.hidden) {
    al.className = 'bat-alert ' + b.cls;
    al.textContent = b.cls === 'bad' ? `батарея ${b.pct} % — плата ось-ось вимкнеться, прогін зупиниться` : `батарея ${b.pct} % — прогін може зупинитись`;
  }
}
function setStatus(cls, text, age, frac, next) {
  $('status').className = 'card status ' + cls;
  $('stText').textContent = text; $('stAge').textContent = age; $('stNext').textContent = next;
  $('stBar').style.width = Math.max(0, Math.min(1, frac)) * 100 + '%';
}
// Раз на секунду: скільки минуло від останнього заміру і коли чекати наступну
// пачку. Сторінка опитує сервер раз на 10 с, тому «через N с» — орієнтир.
function tick() {
  if (!lastData) return;
  const age = Math.max(0, (now() - Date.parse(lastData.last_seen)) / 1000);
  const agoTxt = 'замір ' + fmtAgo(age);
  const bat = batInfo(lastData);
  renderBattery(bat, age > STALE_S);
  if (age > STALE_S) {
    const why = bat && bat.cls ? `Остання батарея ${bat.pct} % — сіла?` : 'Хотспот? Живлення?';
    setStatus('bad', 'плата мовчить', agoTxt, 1, `нема пачок ${fmtDur(age)}. ${why}`);
  } else if (age > LATE_S) {
    setStatus('warn', 'пачка запізнюється', agoTxt, age / STALE_S, `+${Math.round(age - BATCH_S)} с до очікуваної · «мовчить» після ${STALE_S} с`);
  } else if (age > BATCH_S) {
    setStatus('wait', 'чекаю пачку', agoTxt, age / STALE_S, `очікувана вже +${Math.round(age - BATCH_S)} с · оновлю в межах 10 с`);
  } else {
    setStatus('ok', 'плата на зв’язку', agoTxt, age / BATCH_S, `наступна пачка ≈ через ${Math.ceil(BATCH_S - age)} с`);
  }
}

// ---------------------------------------------------------------- плитки
function sigClass(s) { return s == null ? '' : s > SIGMA_BAD ? 'bad' : s > SIGMA_WARN ? 'warn' : 'ok'; }

function renderTiles(d) {
  const last = d.samples[d.samples.length - 1];
  const tiles = $('tiles'); tiles.innerHTML = '';
  d.labels.forEach((lbl, i) => {
    const s = d.sigma_mv[i];
    const note = s > SIGMA_BAD ? ' · мертвий?' : s > SIGMA_WARN ? ' · шум' : '';
    const off = hiddenChannels().has(lbl);
    tiles.insertAdjacentHTML('beforeend', `
      <div class="card tile${off ? ' off' : ''}" data-label="${lbl}" role="button" title="сховати/показати на графіку">
        <div class="lbl"><i style="background:${COLORS[i % COLORS.length]}"></i>${lbl}${off ? ' <small>· схов.</small>' : ''}</div>
        <div class="val num">${last ? last.mv[i] : '—'}<small> мВ</small></div>
        <div class="raw num">raw ${last ? last.raw[i] : '—'}</div>
        <div class="sig ${sigClass(s)} num">σ/хв ${s == null ? '—' : s.toFixed(2)}${note}</div>
      </div>`);
  });
  // Тап по плитці ховає канал на графіку (і виводить зі шкали). Потрібно, коли
  // один канал висить у повітрі або мертвий і розтягує вісь на всю шкалу.
  tiles.querySelectorAll('.tile').forEach(el => el.onclick = () => {
    const set = hiddenChannels(); const l = el.dataset.label;
    set.has(l) ? set.delete(l) : set.add(l);
    try { localStorage.setItem('soil_hide', JSON.stringify([...set])); } catch {}
    if (lastData) { renderTiles(lastData); renderChart(lastData); }
  });
  const air = last && last.air_t != null ? `<b>${last.air_t.toFixed(1)} °C</b> · <b>${last.air_h.toFixed(0)} %</b>` : 'SHT31 нема';
  $('env').innerHTML = last
    ? `<span>вода <b>${last.water_ml.toFixed(0)} мл</b></span><span>повітря ${air}</span><span>t плати <b>${Math.round(last.t)} с</b></span><span>seq <b>${last.seq}</b></span>`
    : 'замірів ще нема';
}

// ---------------------------------------------------------------- графік
// Вісь X — реальний час, відновлений з received_at пачки: пачка надсилається
// одразу після свого останнього заміру, тож x = received_at − (t_max_у_пачці − t).
// Сам `t` для осі не годиться: він скидається командою `r` і не знає доби.
// Прив'язка — до ОСТАННЬОЇ пачки безперервного відрізка t, а не до кожної
// окремо: після обриву черга віддає кілька пачок за секунду з однаковим
// received_at, і попачкова прив'язка наклала б їх одна на одну. Відрізок
// рветься там, де t пішов назад (команда `r`, перезавантаження плати).
function toSeries(d) {
  const n = d.samples.length;
  const xs = new Array(n);
  let end = n - 1;
  for (let i = n - 1; i >= 0; i--) {
    if (i === 0 || d.samples[i - 1].t > d.samples[i].t) {
      const anchor = new Date(d.samples[end].received_at).getTime() / 1000, tEnd = d.samples[end].t;
      for (let k = i; k <= end; k++) xs[k] = anchor - (tEnd - d.samples[k].t);
      end = i - 1;
    }
  }
  const ys = d.labels.map((_, i) => d.samples.map(s => s.mv[i]));
  const temp = d.samples.map(s => s.air_t == null ? null : s.air_t);
  const vbat = d.samples.map(s => s.vbat == null ? null : s.vbat);
  const events = d.samples.map((s, k) => s.event ? { x: xs[k], text: s.event, t: s.t } : null).filter(Boolean);
  return { xs, ys, temp, vbat, events };
}

function hiddenChannels() {
  try { return new Set(JSON.parse(localStorage.getItem('soil_hide') || '[]')); } catch { return new Set(); }
}

// Канал «живий», якщо його σ за хвилину в нормі і він не схований руками.
// Мертвий або висячий канал (σ > SIGMA_BAD, десятки мВ шуму) малюється
// пунктиром, але НЕ бере участі в масштабі осі мВ: інакше два порожні входи
// по 30 мВ розтягують шкалу на 0–900, і зміни живих сенсорів на одиниці мВ
// перетворюються на дві прямі лінії.
function aliveMask(d) {
  const hide = hiddenChannels();
  return d.labels.map((l, i) => !hide.has(l) && d.sigma_mv[i] != null && d.sigma_mv[i] <= SIGMA_BAD);
}

// Межі осі мВ по живих каналах, з полем 10 % і мінімальним розмахом 10 мВ —
// щоб дрібний шум не розтягувався на весь графік як буря.
function mvRange(ys, alive) {
  let lo = Infinity, hi = -Infinity;
  ys.forEach((col, i) => { if (!alive[i]) return; for (const v of col) { if (v == null) continue; if (v < lo) lo = v; if (v > hi) hi = v; } });
  if (!isFinite(lo)) { // жодного живого — показуємо все, як є
    ys.forEach(col => { for (const v of col) { if (v == null) continue; if (v < lo) lo = v; if (v > hi) hi = v; } });
  }
  if (!isFinite(lo)) return [0, 1];
  const span = Math.max(hi - lo, 10), pad = span * 0.1;
  return [lo - pad, hi + pad];
}

function chartHeight() { return window.innerWidth < 640 ? 210 : 280; }

function renderChart(d) {
  const { xs, ys, temp, vbat, events } = toSeries(d);
  const alive = aliveMask(d);
  const hide = hiddenChannels();
  // vbat є лише на батареї; на USB полів нема — тоді ні лінії, ні осі V.
  const hasVbat = vbat.some(v => v != null);
  // Кількість каналів або наявність vbat може змінитись (перепрошивка, інша
  // плата, USB↔батарея) — тоді графік перебудовується з нуля, а не намагається
  // натягнути нові дані на старі серії.
  const key = d.labels.join(',') + '|' + (hasVbat ? 'v' : '');
  if (plot && plot._labels !== key) { plot.destroy(); plot = null; }
  if (!plot) {
    // Кольори осей беремо з теми, щоб графік читався і в темному режимі.
    const axis = { stroke: cssVar('--mut'), grid: { stroke: cssVar('--line') }, ticks: { stroke: cssVar('--line') }, font: '12px "IBM Plex Sans", system-ui' };
    const opts = {
      width: $('chart').clientWidth, height: chartHeight(),
      legend: { show: false }, // кольори каналів показані на плитках
      cursor: { drag: { x: false, y: false } },
      scales: {
        x: { time: true },
        y: { range: (u) => u._yRange || [0, 1] },
        c: { range: (u, min, max) => (min == null || max == null) ? [0, 1] : [min - 0.5, max + 0.5] },
        v: { range: (u, min, max) => (min == null || max == null) ? [3, 4.3] : [Math.min(min, 3.4) - 0.05, Math.max(max, 4.2) + 0.05] },
      },
      axes: [{ ...axis, values: (u, vals) => vals.map(v => new Date(v * 1000).toLocaleTimeString('uk', { hour: '2-digit', minute: '2-digit' })) },
             { ...axis, label: 'мВ', labelFont: '600 12px "IBM Plex Sans", system-ui', size: 52 },
             // Температура другою віссю праворуч: на довгій дистанції саме вона
             // пояснює повільний дрейф мВ, без неї крива висихання не читається.
             { ...axis, scale: 'c', side: 1, label: '°C', labelFont: '600 12px "IBM Plex Sans", system-ui', size: hasVbat ? 40 : 44, grid: { show: false },
               values: (u, vals) => vals.map(v => v.toFixed(1)) },
             // Напруга батареї — третя вісь праворуч, лише коли плата на батареї:
             // на телефоні кожна вісь коштує ширини графіка. Діапазон фіксований
             // 3,4–4,2 В, щоб падіння читалось як падіння, а не як шум на всю висоту.
             ...(hasVbat ? [{ ...axis, scale: 'v', side: 1, size: 46, grid: { show: false }, incrs: [0.2, 0.5, 1],
               values: (u, vals) => vals.map(v => v.toFixed(1) + ' V') }] : [])],
      series: [{ label: 'час' },
               ...d.labels.map((l, i) => ({ label: l, stroke: COLORS[i % COLORS.length], width: 1.5, points: { show: false } })),
               { label: '°C', scale: 'c', stroke: cssVar('--warn'), width: 1.25, dash: [3, 4], points: { show: false } },
               // vbat — сірий довгий пунктир: «умови», як і °C, але інший штрих і колір.
               ...(hasVbat ? [{ label: 'V', scale: 'v', stroke: cssVar('--mut'), width: 1.25, dash: [7, 4], points: { show: false } }] : [])],
      hooks: { draw: [u => {
        const ctx = u.ctx; ctx.save(); ctx.strokeStyle = cssVar('--acc'); ctx.setLineDash([4, 4]); ctx.lineWidth = 1.5;
        for (const e of (u._events || [])) {
          const x = u.valToPos(e.x, 'x', true);
          ctx.beginPath(); ctx.moveTo(x, u.bbox.top); ctx.lineTo(x, u.bbox.top + u.bbox.height); ctx.stroke();
        }
        ctx.restore();
      }] },
    };
    plot = new uPlot(opts, [xs, ...ys, temp, ...(hasVbat ? [vbat] : [])], $('chart'));
    plot._labels = key;
  }
  plot._yRange = mvRange(ys, alive);
  // Мертві/сховані — пунктиром і тонко (сховані зовсім не малюємо).
  d.labels.forEach((l, i) => {
    const sr = plot.series[i + 1];
    const dead = !alive[i];
    sr.dash = dead ? [2, 4] : null; sr.width = dead ? 1 : 1.5;
    plot.setSeries(i + 1, { show: !hide.has(l) }, false);
  });
  plot.setData([xs, ...ys, temp, ...(hasVbat ? [vbat] : [])]);
  plot._events = events;
  $('chartHint').innerHTML = `<span><i class="sw"></i>°C повітря</span>${hasVbat ? '<span><i class="sw sw-v"></i>V батареї</span>' : ''}<span><i class="sw sw-p"></i>долив</span>`;
  $('eventsTitle').textContent = `події · доливи (${events.length})`;
  $('events').innerHTML = events.slice(-10).reverse().map(e =>
    `<div class="num">${new Date(e.x * 1000).toLocaleTimeString('uk')} · t=${Math.round(e.t)} с · <b>${e.text}</b></div>`).join('') || '<div>подій ще нема</div>';
}
window.addEventListener('resize', () => plot && plot.setSize({ width: $('chart').clientWidth, height: chartHeight() }));

// ---------------------------------------------------------------- доливи
// Життя доливу: POST /api/pour → у черзі (sent=false) → плата забрала з
// відповіддю на свою наступну пачку (sent=true) → плата прислала подію
// water+N, і долив зникає з pending_pours. Усе це показуємо в нижній панелі.
function showPending(cls, text, autoHideMs) {
  const p = $('pending'); p.className = 'pending show ' + cls; $('pendingTxt').textContent = text;
  clearTimeout(pendingTimer);
  if (autoHideMs) pendingTimer = setTimeout(() => { p.className = 'pending'; }, autoHideMs);
}
function renderPending(d) {
  const ids = new Set(d.pending_pours.map(p => p.id));
  const confirmed = [...knownPending].filter(id => !ids.has(id));
  knownPending = ids;
  if (d.pending_pours.length) {
    const sent = d.pending_pours.filter(p => p.sent), queued = d.pending_pours.filter(p => !p.sent);
    const parts = [];
    if (sent.length) parts.push(`плата забрала ${sent.map(p => p.ml + ' мл').join(', ')} — чекаю подію water+`);
    if (queued.length) parts.push(`у черзі ${queued.map(p => p.ml + ' мл').join(', ')} — плата забере з наступною пачкою (≤${BATCH_S} с)`);
    showPending('', parts.join(' · '));
  } else if (confirmed.length) {
    showPending('done', 'плата підтвердила долив ✓', 12000);
  } else if (!$('pending').classList.contains('done')) {
    $('pending').className = 'pending';
  }
}

function setMl(v, save = true) {
  const ml = parseFloat(v);
  const ok = ml > 0;
  $('pour').textContent = ok ? `Влив ${ml} мл` : 'Влив … мл';
  $('pour').disabled = !ok;
  for (const b of $('amount').querySelectorAll('button')) b.classList.toggle('on', parseFloat(b.dataset.ml) === ml);
  if (ok && save) store.set('soil_ml', String(ml));
}
$('amount').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-ml]'); if (!b) return;
  $('ml').value = b.dataset.ml; setMl(b.dataset.ml);
});
$('ml').addEventListener('input', () => setMl($('ml').value));

function pourMsg(text, cls) { const m = $('pourMsg'); m.textContent = text; m.className = 'pour-msg' + (text ? ' show' : '') + (cls ? ' ' + cls : ''); }

$('pour').onclick = async () => {
  const ml = parseFloat($('ml').value);
  if (!(ml > 0) || !device) return;
  if (!token()) { askToken(); if (!token()) return; }
  $('pour').disabled = true; pourMsg('надсилаю…');
  try {
    const r = await fetch('/api/pour', { method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token() },
      body: JSON.stringify({ device, ml }) });
    if (r.status === 401) { pourMsg('токен не підійшов', 'bad'); askToken(); }
    else if (!r.ok) { pourMsg('помилка ' + r.status, 'bad'); }
    else {
      pourMsg(`записано ${ml} мл`, 'ok');
      showPending('', `у черзі ${ml} мл — плата забере з наступною пачкою (≤${BATCH_S} с)`);
      refresh();
      setTimeout(() => pourMsg(''), 4000);
    }
  } catch (e) { pourMsg('мережа: ' + e.message, 'bad'); }
  // Коротка пауза — захист від подвійного натискання однією рукою.
  setTimeout(() => setMl($('ml').value, false), 1200);
};

// ---------------------------------------------------------------- опитування
async function refresh() {
  if (!device) return;
  try {
    const r = await fetch(`/api/live?device=${encodeURIComponent(device)}`);
    if (!r.ok) throw new Error(r.status);
    const srv = Date.parse(r.headers.get('Date') || '');
    if (srv) skewMs = srv - Date.now();
    const d = await r.json(); lastData = d;
    showBanner('');
    renderTiles(d); renderChart(d); renderPending(d); tick();
    $('csv').href = `/api/export.csv?device=${encodeURIComponent(device)}`;
  } catch (e) {
    showBanner('Не вдалось отримати дані: ' + e.message);
    if (!lastData) setStatus('bad', 'сервер не відповідає', '', 1, '');
  }
}

// Висота нижньої панелі змінюється (черга доливу, повідомлення) — тримаємо
// відступ контенту таким, щоб графік і події не ховались під нею.
new ResizeObserver(() => {
  document.documentElement.style.setProperty('--bar-h', $('actionbar').offsetHeight + 'px');
}).observe($('actionbar'));

(async () => {
  showTokenState();
  $('ml').value = store.get('soil_ml') || '50'; setMl($('ml').value, false);
  await loadDevices();
  await refresh();
  setInterval(refresh, POLL_MS);
  setInterval(tick, 1000);
})();
</script>

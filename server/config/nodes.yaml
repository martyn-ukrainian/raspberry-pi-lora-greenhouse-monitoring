# Реєстр вузлів - mapping numeric ID (як він приходить з LoRa) до людського імені.
#
# Number → label. Число вузол має "вшите" у прошивку (константа у C++-коді).
# Label збігається з ключем у thresholds.yaml і з node_id що зберігається у БД.
#
# Дії при додаванні нового вузла:
#   1. Вшити наступний доступний number у прошивку.
#   2. Додати рядок нижче: <number>: <label>.
#   3. Переконатись що label є в thresholds.yaml (інакше алерти не спрацюють).

nodes:
  # Номер 0 прибрано 2026-08-24: плат Heltec усього три — два вузли й шлюз, і
  # вузла з номером 0 більше не існує (та плата стала шлюзом). Історія
  # greenhouse-1 у базі лишається, просто нових рядків з таким номером не буде.
  # Якщо номер 0 колись зʼявиться в ефірі, адаптер його відкине з попередженням
  # "Unknown node_id=0" — це правильна поведінка, а не помилка.

  # Етап 3 (сон: якість даних і живлення) — два вузли стоять ПОРУЧ, у тому
  # самому ґрунті, і шлють одночасно. Різні номери тут не формальність:
  # з однаковим NODE_ID вони злились би в один ряд у базі, і порівнювати
  # стало б нічого. Номер вшивається прапорцем: -DNODE_ID=1.
  1: stage3-reference   # greenhouse-node, безперервно, 1 Гц; щуп v20B
  2: stage3-lowpower    # greenhouse-node-lowpower, сон 5 хв (тимчасово; штатно 15); щуп v20A

  # Етап 4 (v2 проти v1) — та сама грядка, третій номер. Прошивка
  # greenhouse-node-v2: вікно неспання 4,6 с замість 21,7 і один пакет за цикл
  # замість семи. Стоїть ПОРУЧ із вузлом 2, щоб порівнювати парно.
  #
  # Номер саме 3, а не 1: під номером 1 лежить архів безперервного режиму, і
  # мішати з ним інтервальні дані означало б зіпсувати обидві серії.
  3: stage4-lowpower-v2   # greenhouse-node-v2, сон 5 хв (тимчасово; штатно 15)

  # 255 — не вузол, а сам шлюз: він шле власні події (збій радіо, битий CRC)
  # тим самим NDJSON. Номер зарезервований, не віддавати теплиці.
  255: gateway

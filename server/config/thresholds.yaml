# Пороги алертів для теплиць.
# Стартові значення взято з docs/журнал.md, коригувати за сезоном на фактичних вимірах.
# Формат і логіка описані в docs/alerts.md.

# Глобальні дефолти. Можна перекрити per-sensor у блоках теплиць нижче.
defaults:
  dwell_minutes: 5 # скільки хвилин стан має триматись поза межами до алерта
  cooldown_minutes: 30 # тиша після алерта, скільки не повторювати

# Кожна теплиця має власний набір порогів.
# Дії при додаванні нової теплиці:
#   1. Скопіювати блок нижче.
#   2. Змінити node_id (ключ) і label (людське імʼя).
#   3. Виправити пороги під культуру й фізичні умови цієї теплиці.
greenhouses:
  # ---------------------------------------------------------------------------
  # Етап 3: два вузли поруч, у тому самому ґрунті — опорний і зі сном.
  # ---------------------------------------------------------------------------
  # Вони тут не заради алертів, а заради ВИДИМОСТІ: сторінка /live малює лише
  # те, що віддає /greenhouses, а той список будується саме з цього файлу.
  # Без цих блоків вузли шлють, дані лягають у базу — і не показуються ніде.
  #
  # Пороги свідомо розкриті навстіж. Це стенд у кімнаті, а не грядка: ґрунтовий
  # щуп то підключений, то ні, калібрування попереду, і вузькі межі дали б потік
  # алертів у Telegram про неіснуючі проблеми. Звузити, коли вузли стануть у
  # ґрунт і з'явиться цикл висихання.
  stage3-reference:
    label: "Етап 3 · опорний, безперервно"
    air_temperature:
      min: 0.0
      max: 50.0
      dwell_minutes: 5
    air_humidity:
      min: 0.0
      max: 100.0
      dwell_minutes: 10
    soil_moisture:
      min: 0.0
      max: 100.0
      dwell_minutes: 20

  stage3-lowpower:
    label: "Етап 3 · сон 5 хв"
    # Витримки більші за опорний вузол навмисно: цей шле раз на 5 хвилин, і
    # dwell, коротший за два цикли, спрацьовував би від одного пропущеного
    # пакета замість реальної тривалої аномалії.
    air_temperature:
      min: 0.0
      max: 50.0
      dwell_minutes: 15
    air_humidity:
      min: 0.0
      max: 100.0
      dwell_minutes: 20
    soil_moisture:
      min: 0.0
      max: 100.0
      dwell_minutes: 30

  # ---------------------------------------------------------------------------
  # Етап 4: v2 поруч із v1, та сама грядка
  # ---------------------------------------------------------------------------
  # Блок тут не заради алертів, а заради ВИДИМОСТІ: без нього вузол шле, дані
  # лягають у базу — і не показуються ніде. Пастка вже коштувала окремого
  # з'ясування 24.08.
  stage4-lowpower-v2:
    label: "Етап 4 · v2, коротке вікно"
    air_temperature:
      min: 0.0
      max: 50.0
      dwell_minutes: 15
    air_humidity:
      min: 0.0
      max: 100.0
      dwell_minutes: 20
    soil_moisture:
      min: 0.0
      max: 100.0
      dwell_minutes: 30
